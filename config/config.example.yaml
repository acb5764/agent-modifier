# agent-modifier configuration template.
#
# Copy this file to config.yaml (config.yaml is gitignored -- it holds a
# real phone number and shouldn't be committed) and fill in your own
# values. `scripts/setup.sh` does this copy for you automatically if
# config.yaml doesn't already exist.

# trigger: prefix a message must start with to be treated as a command.
# Everything after it (trimmed) becomes the instruction sent to Claude Code,
# e.g. "🥭 add a dark mode toggle" -> instruction "add a dark mode toggle".
# Any word or emoji works -- this is just an example.
trigger: "🥭"

# agent_name: shown in PR titles/bodies and signed onto text replies, so it's
# obvious a change came from this automation and not a human dev. Optional --
# defaults to "agent-modifier" if omitted.
agent_name: "agent-modifier"

target_repo:
  # Local path to the repo this system modifies. Must already be a git repo
  # with a configured remote, and `gh auth status` must show access to it.
  path: "~/projects/YOUR_REPO"
  base_branch: "main"
  # Optional: glob patterns (fnmatch-style) for files that are low-risk
  # enough to push straight to base_branch, no PR needed. A dispatched
  # change is auto-pushed only if EVERY file it touches matches one of
  # these patterns; any other file (or no patterns configured) means the
  # normal push-a-branch + open-a-PR flow is used instead.
  # auto_push_patterns:
  #   - "data/inventory.json"
  # Optional: extra environment variables passed to the `claude` subprocess,
  # on top of this process's own environment. Every dispatched command runs
  # in a brand-new git worktree, which only contains committed files -- so
  # if the target repo has its own tooling (e.g. an MCP server) that reads
  # secrets from a gitignored .env, that file won't exist in the worktree
  # and the tooling will silently fall back to defaults. Put those secrets
  # here instead (this file is already gitignored).
  # env:
  #   MONGODB_URI: "mongodb+srv://user:pass@cluster.mongodb.net/?retryWrites=true&w=majority"
  #   MONGODB_DB: "emm"
  #
  # If the target repo has an `.mcp.json` at its root, it's passed to every
  # dispatched session automatically via `--mcp-config` (see dispatcher.py)
  # so its MCP tools are available without needing the interactive,
  # per-checkout approval a fresh worktree would otherwise be stuck on.

allowlist:
  # Phone numbers / iMessage handles allowed to trigger commands, e.g.
  # "+15551234567". Messages from anyone not on this list are ignored even
  # if they match the trigger. An empty list means nothing is ever actioned
  # -- fill this in before relying on the poller.
  #
  # The format must match exactly what's stored in chat.db. Once Full Disk
  # Access is granted, confirm with:
  #   sqlite3 ~/Library/Messages/chat.db "SELECT DISTINCT id FROM handle;"
  imessage: []

poll_interval_seconds: 15

claude:
  # See `claude --help` for the full list of --permission-mode values.
  # bypassPermissions is required for unattended runs -- there's no human
  # available to approve Edit/Bash/etc. tool calls. The worktree + PR-gate
  # model (see README) is what keeps this safe: nothing lands on
  # base_branch without a human merging it.
  permission_mode: "bypassPermissions"
  # Hard cap on spend per dispatched command, as a backstop against
  # runaway loops.
  max_budget_usd: 2.00
